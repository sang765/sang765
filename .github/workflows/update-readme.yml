name: Update Top Activity Repos

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch top active repos and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import subprocess
          import re

          # Fetch repos sorted by most recently pushed, exclude forks
          result = subprocess.run(
              ['gh', 'api', 'users/sang765/repos?per_page=100&sort=pushed&direction=desc',
               '--jq', '[.[] | select(.fork == false)] | .[0:4] | .[] | .name'],
              capture_output=True, text=True
          )
          repos = result.stdout.strip().split('\n')

          # Build the HTML cards
          cards = []
          for repo in repos:
              if repo:
                  cards.append(
                      f'  <a href="https://github.com/sang765/{repo}">'
                      f'<img src="https://github-stats-extended.vercel.app/api/pin/?username=sang765&repo={repo}'
                      f'&title_color=fff&icon_color=f9f9f9&text_color=9f9f9f&bg_color=151515" '
                      f'alt="{repo}"></a>'
                  )

          # Read README
          with open('README.md', 'r') as f:
              content = f.read()

          # Replace content between markers
          new_content = re.sub(
              r'<!-- TOP_REPOS_START -->.*?<!-- TOP_REPOS_END -->',
              '<!-- TOP_REPOS_START -->\n' + '\n'.join(cards) + '\n<!-- TOP_REPOS_END -->',
              content,
              flags=re.DOTALL
          )

          # Write back
          with open('README.md', 'w') as f:
              f.write(new_content)

          print(f"Updated with repos: {', '.join(repos[:4])}")
          EOF

      - name: Commit if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update top activity repos [skip ci]" && git push
