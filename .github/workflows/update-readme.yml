name: Update Top Activity Repos

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch repos and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import subprocess
          import re
          import json

          # Fetch all repos sorted by most recently pushed
          result = subprocess.run(
              ['gh', 'api', 'users/sang765/repos?per_page=100&sort=pushed&direction=desc',
               '--jq', '[.[] | {name, description, archived, fork}]'],
              capture_output=True, text=True
          )

          all_repos = json.loads(result.stdout)
          home_made_repos = [r for r in all_repos if not r.get("fork")]
          fork_repos = [r for r in all_repos if r.get("fork")]

          top_home_made = home_made_repos[:4]
          top_forks = fork_repos[:4]

          # Build the HTML cards for top activity (2x2 board)
          def card_html(repo):
              return (
                  f'<a href="https://github.com/sang765/{repo["name"]}">'
                  f'<img src="https://github-stats-extended.vercel.app/api/pin/?username=sang765&repo={repo["name"]}'
                  f'&title_color=fff&icon_color=f9f9f9&text_color=9f9f9f&bg_color=151515" '
                  f'alt="{repo["name"]}"></a>'
              )

          def build_board(repos):
              rows = []
              for i in range(0, len(repos), 2):
                  left = card_html(repos[i])
                  right = card_html(repos[i + 1]) if i + 1 < len(repos) else ""
                  rows.append(f'  <tr>\n    <td align="left">{left}</td>\n    <td align="left">{right}</td>\n  </tr>')
              return '<table>\n' + '\n'.join(rows) + '\n</table>'

          top_repos_html = (
              '<h3>🏆 Top Home Made</h3>\n'
              + build_board(top_home_made)
              + '\n<br>\n'
              + '<h3>🍴 Top Fork</h3>\n'
              + build_board(top_forks)
          )

          # Build the markdown list for all home made repos
          home_made_list = []
          for repo in home_made_repos:
              desc = repo.get("description") or "No description"
              archive_tag = " `(Public Archive)`" if repo.get("archived") else ""
              home_made_list.append(
                  f'- **[{repo["name"]}](https://github.com/sang765/{repo["name"]})** - {desc}{archive_tag}'
              )

          # Read README
          with open('README.md', 'r') as f:
              content = f.read()

          # Replace top repos section
          new_content = re.sub(
              r'<!-- TOP_REPOS_START -->.*?<!-- TOP_REPOS_END -->',
              '<!-- TOP_REPOS_START -->\n' + top_repos_html + '\n<!-- TOP_REPOS_END -->',
              content,
              flags=re.DOTALL
          )

          # Replace home made section
          new_content = re.sub(
              r'<!-- HOME_MADE_START -->.*?<!-- HOME_MADE_END -->',
              '<!-- HOME_MADE_START -->\n' + '\n'.join(home_made_list) + '\n<!-- HOME_MADE_END -->',
              new_content,
              flags=re.DOTALL
          )

          # Write back
          with open('README.md', 'w') as f:
              f.write(new_content)

          print(f"Updated top home made: {', '.join(r['name'] for r in top_home_made)}")
          print(f"Updated top forks: {', '.join(r['name'] for r in top_forks)}")
          print(f"Updated home made list: {len(home_made_repos)} repos")
          EOF

      - name: Commit if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: update top activity repos [skip ci]" && git pull --rebase origin main && git push)
