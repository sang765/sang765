name: Update Top Activity Repos

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch repos and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import subprocess
          import re

          # Fetch all repos sorted by most recently pushed, exclude forks
          result = subprocess.run(
              ['gh', 'api', 'users/sang765/repos?per_page=100&sort=pushed&direction=desc',
               '--jq', '[.[] | select(.fork == false)] | [.[] | {name, description, archived}]'],
              capture_output=True, text=True
          )

          import json
          all_repos = json.loads(result.stdout)
          top4 = all_repos[:4]

          # Build the HTML cards for top activity (2x2 board)
          def card_html(repo):
              return (
                  f'<a href="https://github.com/sang765/{repo["name"]}">'
                  f'<img src="https://github-stats-extended.vercel.app/api/pin/?username=sang765&repo={repo["name"]}'
                  f'&title_color=fff&icon_color=f9f9f9&text_color=9f9f9f&bg_color=151515" '
                  f'alt="{repo["name"]}"></a>'
              )

          rows = []
          for i in range(0, len(top4), 2):
              left = card_html(top4[i])
              right = card_html(top4[i + 1]) if i + 1 < len(top4) else ""
              rows.append(f'  <tr>\n    <td align="center">{left}</td>\n    <td align="center">{right}</td>\n  </tr>')

          board = '<table>\n' + '\n'.join(rows) + '\n</table>'

          # Build the markdown list for all home made repos
          home_made = []
          for repo in all_repos:
              desc = repo.get("description") or "No description"
              archive_tag = " `(Public Archive)`" if repo.get("archived") else ""
              home_made.append(
                  f'- **[{repo["name"]}](https://github.com/sang765/{repo["name"]})** - {desc}{archive_tag}'
              )

          # Read README
          with open('README.md', 'r') as f:
              content = f.read()

          # Replace top repos section
          new_content = re.sub(
              r'<!-- TOP_REPOS_START -->.*?<!-- TOP_REPOS_END -->',
              '<!-- TOP_REPOS_START -->\n' + board + '\n<!-- TOP_REPOS_END -->',
              content,
              flags=re.DOTALL
          )

          # Replace home made section
          new_content = re.sub(
              r'<!-- HOME_MADE_START -->.*?<!-- HOME_MADE_END -->',
              '<!-- HOME_MADE_START -->\n' + '\n'.join(home_made) + '\n<!-- HOME_MADE_END -->',
              new_content,
              flags=re.DOTALL
          )

          # Write back
          with open('README.md', 'w') as f:
              f.write(new_content)

          print(f"Updated top repos: {', '.join(r['name'] for r in top4)}")
          print(f"Updated home made: {len(all_repos)} repos")
          EOF

      - name: Commit if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: update top activity repos [skip ci]" && git pull --rebase origin main && git push)
